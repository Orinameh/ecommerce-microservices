# Gitleaks 8.24.3 config — single [allowlist] map (not [[allowlist]] slice)
# See: https://github.com/gitleaks/gitleaks#configuration
# Error "'Allowlist' expected a map, got 'slice'" = use [allowlist] not [[allowlist]]
title = "ecommerce-microservices gitleaks config"

[allowlist]
  description = "global allowlist — scoped paths/regexes, generic password/guest NOT allowed globally"
  paths = [
    '''docker-compose\.yaml''',
    '''\.env\.example''',
    '''infra/k8s/base/configmap\.yaml''',
    '''infra/k8s/overlays/production/kustomization\.yaml''',
    '''README\.md''',
    '''\.gitleaks\.toml''',
    '''\.trivyignore''',
  ]
  regexes = [
    '''MONGO_INITDB_ROOT_PASSWORD:\s*password\b''', # docker-compose local dev placeholder — real creds in .env (gitignored)
    '''YOUR_STRONG_PASSWORD''',                     # .env.example placeholder only
    '''ghcr\.io/orinameh''',                       # historical image name, lowercase orinameh now
  ]
  # commits = ["abc123..."] # if you need to allow a rotated commit, uncomment: reason = "rotated 2026-03-20"
