apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ecommerce
resources:
  - namespace.yaml
  - configmap.yaml
  # secrets.yaml is gitignored — create from: cp secrets.example.yaml secrets.yaml
  # - secrets.yaml
  - mongodb/service.yaml
  - mongodb/statefulset.yaml
  - rabbitmq/service.yaml
  - rabbitmq/statefulset.yaml
  - customer-service/service.yaml
  - customer-service/deployment.yaml
  - product-service/service.yaml
  - product-service/deployment.yaml
  - order-service/service.yaml
  - order-service/deployment.yaml
  - payment-service/service.yaml
  - payment-service/deployment.yaml
  - transaction-worker/deployment.yaml
  - ingress.yaml
# Never use :latest — immutable tags only (semver or git SHA). Override via:
# kustomize edit set image ghcr.io/your-org/customer-service=ghcr.io/your-org/customer-service:$(git rev-parse --short HEAD)
images:
  - name: ghcr.io/your-org/customer-service
    newTag: v1.0.0
  - name: ghcr.io/your-org/product-service
    newTag: v1.0.0
  - name: ghcr.io/your-org/order-service
    newTag: v1.0.0
  - name: ghcr.io/your-org/payment-service
    newTag: v1.0.0
commonLabels:
  app: ecommerce-microservices
