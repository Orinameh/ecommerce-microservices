# Copy to secrets.yaml and fill real values: cp k8s/secrets.example.yaml k8s/secrets.yaml
# secrets.yaml is gitignored — never commit real credentials
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: ecommerce
type: Opaque
stringData:
  # Must match shared/utils/config.ts:27 required MONGODB_URI (no hardcoded admin:password in code)
  MONGODB_URI: "mongodb://admin:YOUR_STRONG_PASSWORD@mongodb:27017/ecommerce?authSource=admin"
  MONGO_INITDB_ROOT_USERNAME: "admin"
  MONGO_INITDB_ROOT_PASSWORD: "YOUR_STRONG_PASSWORD"
  RABBITMQ_DEFAULT_USER: "guest"
  RABBITMQ_DEFAULT_PASS: "guest"
