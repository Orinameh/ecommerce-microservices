apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ecommerce
resources:
- ../../base
# Production overlay — immutable SHA tags (never :latest), higher replicas/resources
# CI updates these via: kustomize edit set image ghcr.io/orinameh/customer-service:8c7ee93
# in infra/k8s/overlays/production (see .github/workflows/ci.yml update-k8s job)
images:
- name: ghcr.io/orinameh/customer-service
  newName: ghcr.io/orinameh/customer-service
  newTag: 52d4897
- name: ghcr.io/orinameh/order-service
  newName: ghcr.io/orinameh/order-service
  newTag: 52d4897
- name: ghcr.io/orinameh/payment-service
  newName: ghcr.io/orinameh/payment-service
  newTag: 52d4897
- name: ghcr.io/orinameh/product-service
  newName: ghcr.io/orinameh/product-service
  newTag: 52d4897
replicas:
- count: 2
  name: customer-service
- count: 2
  name: product-service
- count: 3
  name: order-service
- count: 3
  name: payment-service
# Example production patch (uncomment to enforce):
# patches:
#   - path: ingress-patch.yaml
#     target:
#       kind: Ingress
#       name: ecommerce-ingress
commonLabels:
  app: ecommerce-microservices
  env: production
