apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ecommerce
resources:
  - ../../base
# Dev overlay — single replica, lighter, uses same SHA tags via base (or local v1.0.0)
images:
  - name: ghcr.io/your-org/customer-service
    newTag: v1.0.0
  - name: ghcr.io/your-org/product-service
    newTag: v1.0.0
  - name: ghcr.io/your-org/order-service
    newTag: v1.0.0
  - name: ghcr.io/your-org/payment-service
    newTag: v1.0.0
replicas:
  - name: customer-service
    count: 1
  - name: product-service
    count: 1
  - name: order-service
    count: 1
  - name: payment-service
    count: 1
commonLabels:
  app: ecommerce-microservices
  env: dev
