services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: ecommerce-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: ecommerce
    volumes:
      - mongodb_data:/data/db
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    container_name: ecommerce-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Customer Service
  customer-service:
    build: 
      context: .
      dockerfile: services/customer-service/Dockerfile
    container_name: customer-service
    restart: always
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/ecommerce?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ecommerce-network

  # Product Service
  product-service:
    build: 
      context: .
      dockerfile: services/product-service/Dockerfile
    container_name: product-service
    restart: always
    ports:
      - "5002:5002"
    environment:
      - NODE_ENV=production
      - PORT=5002
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/ecommerce?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ecommerce-network

  # Order Service
  order-service:
    build: 
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: order-service
    restart: always
    ports:
      - "5003:5003"
    environment:
      - NODE_ENV=production
      - PORT=5003
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/ecommerce?authSource=admin
      - CUSTOMER_SERVICE_URL=http://customer-service:5001
      - PRODUCT_SERVICE_URL=http://product-service:5002
      - PAYMENT_SERVICE_URL=http://payment-service:5004
    depends_on:
      mongodb:
        condition: service_healthy
      customer-service:
        condition: service_started
      product-service:
        condition: service_started
      payment-service:
        condition: service_started
    networks:
      - ecommerce-network

  # Payment Service
  payment-service:
    build: 
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: payment-service
    restart: always
    ports:
      - "5004:5004"
    environment:
      - NODE_ENV=production
      - PORT=5004
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/ecommerce?authSource=admin
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - ORDER_SERVICE_URL=http://order-service:5003
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-network

  # Transaction Worker (runs separately)
  transaction-worker:
    build: 
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: transaction-worker
    restart: always
    command: node dist/workers/transaction.worker.js
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/ecommerce?authSource=admin
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - ORDER_SERVICE_URL=http://order-service:5003
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      payment-service:
        condition: service_started
      order-service:
        condition: service_started
    networks:
      - ecommerce-network

volumes:
  mongodb_data:
  rabbitmq_data:

networks:
  ecommerce-network:
    driver: bridge