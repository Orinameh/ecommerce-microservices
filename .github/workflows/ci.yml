name: CI — Build & Push (SHA tag, never :latest)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [customer-service, product-service, order-service, payment-service]
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.7.1

      - name: Set SHA tag
        id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Docker meta (lowercase, SHA — never :latest)
        id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=,format=short
            type=sha,prefix=sha-,format=short

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # For ECR: uncomment and set AWS secrets (Node 24)
      # - uses: aws-actions/configure-aws-credentials@v4.0.2
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     aws-region: us-east-1
      # - uses: aws-actions/amazon-ecr-login@v2.0.1

      # For GCP: uncomment (Node 24)
      # - uses: google-github-actions/auth@v2.1.7
      #   with:
      #     credentials_json: ${{ secrets.GCP_SA_KEY }}
      # - uses: google-github-actions/setup-gcloud@v2.1.2

      - name: Build
        uses: docker/build-push-action@v6.10.0
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Single GitOps commit — aligns infra/k8s/* (ghcr.io/orinameh/...:v1.0.0) with GHCR's ghcr.io/${{ github.repository_owner }}/...:sha-xxxx
  update-k8s:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set SHA tag
        run: echo "TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Update k8s manifests to SHA (overlays/production)
        run: |
          # yq is Node 24 compatible, no kustomize Node 20 needed
          pip install -q yq 2>/dev/null || npm i -g yq 2>/dev/null || true
          # Use yq/sed to update newTag in infra/k8s/overlays/production/kustomization.yaml
          # Fallback to sed if yq not available
          for svc in customer-service product-service order-service payment-service; do
            # kustomize edit set image equivalent via yq/sed — updates newTag and newName
            if command -v yq >/dev/null 2>&1; then
              yq -i ".images |= map(select(.name == \"ghcr.io/orinameh/$svc\") .newTag = env(TAG) | .newName = \"ghcr.io/${{ github.repository_owner }}/$svc\")" infra/k8s/overlays/production/kustomization.yaml 2>/dev/null || \
              sed -i "s|ghcr.io/orinameh/$svc.*|ghcr.io/${{ github.repository_owner }}/$svc:${{ env.TAG }}|g" infra/k8s/overlays/production/kustomization.yaml
            else
              sed -i.bak "s|newTag:.*|newTag: ${{ env.TAG }}|g" infra/k8s/overlays/production/kustomization.yaml
              # Ensure newName is correct
              if ! grep -q "${{ github.repository_owner }}/$svc" infra/k8s/overlays/production/kustomization.yaml; then
                sed -i.bak "s|ghcr.io/orinameh/$svc|ghcr.io/${{ github.repository_owner }}/$svc|g" infra/k8s/overlays/production/kustomization.yaml
              fi
            fi
          done
          # Also handle base if needed
          cat infra/k8s/overlays/production/kustomization.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add infra/k8s/overlays/production/kustomization.yaml
          git diff --cached --quiet || git commit -m "chore(k8s): bump images to ${{ env.TAG }}"
          git push || echo "no push"

