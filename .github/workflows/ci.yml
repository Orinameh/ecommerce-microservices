  #   if: github.ref == 'refs/heads/main' && github.event_name == 'push'
  #   defaults:
  #     run:
  #       working-directory: infra/gcp
  #   steps:
  #     - uses: actions/checkout@v4.2.2
  #     - uses: hashicorp/setup-terraform@v3.1.2
