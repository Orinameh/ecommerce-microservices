name: CI — Build & Push (SHA tag, never :latest)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# least-privilege default
permissions:
  contents: read

env:
  REGISTRY: ghcr.io

# Cancel superseded PR runs, but never cancel main
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1) Leaked secrets — fail-fast before any build
  # ─────────────────────────────────────────────────────────────
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout (full history for gitleaks)
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Gitleaks — detect leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────
  # 2) Trivy FS: repo, Dockerfiles, K8s manifests (secrets + misconfig)
  # Runs in parallel with secret-scan, no image build needed
  # ─────────────────────────────────────────────────────────────
  trivy-fs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Trivy FS — secrets + misconfig (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0 # ed142fd = v0.36.0, immutable after CVE-2026-33634
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln,secret,config'
          ignore-unfixed: true
          exit-code: '0' # advisory — image scan below is blocking

      - name: Upload Trivy FS SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # ─────────────────────────────────────────────────────────────
  # 3) Build → Trivy image scan → Push (only if scan passes)
  # Build once with load:true, scan local image, then docker push
  # No second build — saves ~2× minutes × 4 services
  # ─────────────────────────────────────────────────────────────
  build-and-push:
    needs: [secret-scan, trivy-fs]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        service: [customer-service, product-service, order-service, payment-service]
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.7.1

      # DEAD CODE: unused — kept for learning — Build uses docker/metadata-action outputs (steps.meta.outputs.tags) instead
      # - name: Set SHA tag
      #   id: tag
      #   run: echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Docker meta (lowercase, SHA — never :latest)
        id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=,format=short
            type=sha,prefix=sha-,format=short

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # For ECR: uncomment and set AWS secrets (Node 24)
      # - uses: aws-actions/configure-aws-credentials@v4.0.2
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     aws-region: us-east-1
      # - uses: aws-actions/amazon-ecr-login@v2.0.1

      # For GCP: uncomment (Node 24)
      # - uses: google-github-actions/auth@v2.1.7
      #   with:
      #     credentials_json: ${{ secrets.GCP_SA_KEY }}
      # - uses: google-github-actions/setup-gcloud@v2.1.2

      - name: Build
        uses: docker/build-push-action@v6.10.0
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Trivy — scan image for HIGH/CRITICAL vulns
        uses: aquasecurity/trivy-action@v0.36.0 # ed142fd0673e97e23eac54620cfb913e5ce36c25 = v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'
          ignore-unfixed: true
          exit-code: '1' # blocking — fixed at Dockerfile via apk upgrade (libssl3/libcrypto3 3.5.7->3.5.8 on alpine 3.24)
          # To allowlist CVEs: add to .trivyignore with justification + expiry
      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - name: Also output human-readable table to logs (non-blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        if: always()
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'
          ignore-unfixed: true
          exit-code: '0'

      - name: Push already-scanned image to GHCR (no rebuild)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' | while read -r tag; do
            [ -z "$tag" ] && continue
            echo "Pushing $tag"
            docker push "$tag"
          done

  # Single GitOps commit — aligns infra/k8s/* with GHCR's ghcr.io/<owner>/...:sha-xxxx
  update-k8s:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: update-k8s-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set SHA tag
        run: echo "TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Update k8s manifests to SHA (overlays/production)
        run: |
          set -euo pipefail
          # Pinned yq — avoid pip latest breakage
          pip install -q "yq==3.4.3" 2>/dev/null || npm i -g yq@3 2>/dev/null || true

          # Ensure we are up-to-date before committing
          git pull --rebase origin main || true

          TAG_LOWER=$(echo "${{ env.TAG }}" | tr '[:upper:]' '[:lower:]')
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          for svc in customer-service product-service order-service payment-service; do
            # normalize: kustomization.yaml now uses lowercase ghcr.io/<owner>
            # select is case-insensitive via lowercasing — use sed fallback if yq fails
            if command -v yq >/dev/null 2>&1; then
              # update both legacy Orinameh and new owner entries
              yq -i "(.images[] | select(.name | test(\"ghcr.io/(orinameh|$OWNER_LOWER)/$svc\"; \"i\")) | .newTag) = strenv(TAG_LOWER)" infra/k8s/overlays/production/kustomization.yaml 2>/dev/null || true
              yq -i "(.images[] | select(.name | test(\"ghcr.io/(orinameh|$OWNER_LOWER)/$svc\"; \"i\")) | .newName) = \"ghcr.io/$OWNER_LOWER/$svc\"" infra/k8s/overlays/production/kustomization.yaml 2>/dev/null || true
            fi
            # sed fallback — case-insensitive, handles both old and new names
            sed -i.bak -E "s|ghcr\.io/[^/]+/$svc:[^[:space:]'\"]+|ghcr.io/$OWNER_LOWER/$svc:$TAG_LOWER|I" infra/k8s/overlays/production/kustomization.yaml || true
          done

          echo "--- updated kustomization ---"
          cat infra/k8s/overlays/production/kustomization.yaml

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add infra/k8s/overlays/production/kustomization.yaml
          git diff --cached --quiet || git commit -m "chore(k8s): bump images to ${TAG_LOWER}"
          git push || echo "no push — concurrent update, will be retried next run"

  # ─────────────────────────────────────────────────────────────
  # 4) Helm — lint on PR, upgrade --install on main (opt-in, automated)
  # ArgoCD + kube-prometheus-stack via Helm (pinned, atomic, Node 24)
  # Requires secret: KUBE_CONFIG (base64 kubeconfig). Enable by uncommenting.
  # ─────────────────────────────────────────────────────────────
  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Lint on PR (no cluster), deploy only on main push
    if: always() # runs after build; deploy step gated inside
    needs: [secret-scan, trivy-fs]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: v3.14.4 # pinned 2026 stable, Node 24 compatible

      - name: Helm lint — ArgoCD & monitoring (no cluster)
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm lint infra/argocd --values infra/argocd/values.yaml || helm lint argo/argo-cd --version 7.8.0 --values infra/argocd/values.yaml
          # kube-prometheus-stack values are defaults + overrides from monitoring/README — lint chart itself
          helm template test prometheus-community/kube-prometheus-stack --version 71.1.0 --set prometheus.prometheusSpec.serviceMonitorSelectorNilUsesHelmValues=false > /tmp/kube-prom.yaml
          echo "Helm lint/template OK"

      - name: Set up kubectl (for deploy)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/setup-kubectl@v4.0.1

      - name: Deploy via Helm — ArgoCD + monitoring (main only, requires KUBE_CONFIG)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          if [ -z "${KUBE_CONFIG:-}" ]; then
            echo "::notice::KUBE_CONFIG not set — skipping Helm deploy (lint already passed). Set secret to enable automated install."
            exit 0
          fi
          echo "$KUBE_CONFIG" | base64 -d > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          kubectl cluster-info || (echo "cluster unreachable" && exit 0)

          helm repo add argo https://argoproj.github.io/argo-helm 2>/dev/null || true
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts 2>/dev/null || true
          helm repo update

          echo "→ ArgoCD"
          helm upgrade --install argocd argo/argo-cd \
            --namespace argocd --create-namespace \
            --version 7.8.0 \
            -f infra/argocd/values.yaml \
            --atomic --wait --timeout 5m

          echo "→ kube-prometheus-stack (monitoring)"
          helm upgrade --install kube-prom prometheus-community/kube-prometheus-stack \
            --namespace monitoring --create-namespace \
            --version 71.1.0 \
            --set prometheus.prometheusSpec.serviceMonitorSelectorNilUsesHelmValues=false \
            --set prometheus.prometheusSpec.podMonitorSelectorNilUsesHelmValues=false \
            --set grafana.ingress.enabled=false \
            --atomic --wait --timeout 5m

          echo "→ Apply ServiceMonitor/PrometheusRule (post-CRD)"
          kubectl apply -k infra/k8s/base/monitoring || echo "monitoring CRDs not yet ready — will be synced by ArgoCD"

          kubectl -n argocd rollout status deployment/argocd-server --timeout=120s || true
          kubectl -n monitoring rollout status deployment/kube-prom-kube-pm-operator --timeout=120s || true

  # --- OPT-IN: Cloud infra & K8s (uncomment to enable) ---
